# Scrub volatile-status.txt from remote cache keys so that stamped actions
# (e.g. pkg_rpm with stamp=1) can share cache entries across builds.
# BUILD_TIMESTAMP and other volatile values change every build but don't affect
# correctness of cached outputs; stable-status.txt is still included in the
# cache key so genuine stamp changes still cause cache misses.
rules {
  transform {
    omitted_inputs: "bazel-out/volatile-status.txt"
  }
}
